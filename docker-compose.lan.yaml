# Opt-in LAN override for on-device (iOS / iPadOS) CalDAV/CardDAV testing over HTTPS (ADR 0032).
#
# Apple clients require HTTPS with a trusted certificate, and the default proxy only serves
# `localhost`. This override makes the Caddy proxy ALSO serve your machine's LAN IP/hostname, with a
# tls-internal certificate whose SAN matches it — so an iPhone/iPad can add a CalDAV/CardDAV account
# at https://<LAN_HOST>/dav/ after trusting Caddy's root CA once. The DAV surface uses app-password
# auth and relative hrefs, so it just works from the device; the web UI/OIDC stay on localhost.
#
# Usage:
#   LAN_HOST=10.0.2.23 docker compose -f docker-compose.yaml -f docker-compose.lan.yaml up -d
#   docker compose exec proxy cat /data/caddy/pki/authorities/local/root.crt   # install/trust on the device
#   # then on iOS: Settings > Calendar > Accounts > Add > Other > Add CalDAV Account
#   #   Server = <LAN_HOST>, User = your email, Password = an app password
#
# DAVx5 (Android) does NOT need this — it can use plain http://<LAN_HOST>:9080/dav/ directly.
# Also runs under `podman compose` (portable values only).
#
# This override is also the on-device WebDAV-Push (ADR 0052) test bed: it enables ephemeral VAPID keys
# so DAVx5 can register for and receive push notifications. Ephemeral keys reset on restart (any device
# subscriptions drop) — fine for testing, never production (set real VapidPublicKey/PrivateKey there).
#
# Self-hosted ntfy for reliable push delivery (ADR 0081): add `--profile push` to also run a local ntfy
# behind Caddy at https://<LAN_HOST>:8443, so DAVx5's UnifiedPush stays on the LAN instead of the public
# ntfy.sh (whose WebSocket the device/network may block). Point the ntfy Android app's default server at
# https://<LAN_HOST>:8443 (the phone already trusts the Caddy root CA from the DAV step). Example:
#   LAN_HOST=10.0.2.23 docker compose -f docker-compose.yaml -f docker-compose.lan.yaml --profile push up -d
services:
  proxy:
    environment:
      - LAN_HOST=${LAN_HOST:?set LAN_HOST to your machine's LAN IP or hostname, e.g. LAN_HOST=192.168.1.50}
    ports:
      - "8443:8443"   # HTTPS front for the self-hosted ntfy (ADR 0081, --profile push)
    volumes:
      # Replaces the localhost-only Caddyfile with one that also serves $LAN_HOST (same target path).
      - ./deploy/Caddyfile.lan:/etc/caddy/Caddyfile:ro
  api:
    environment:
      # WebDAV-Push (ADR 0052): generate an ephemeral VAPID pair so push is enabled for device testing.
      # Implicit in Development already; set explicitly here so push testing is intentional for this override.
      SimplCalCon__WebPush__AllowEphemeralKeys: "true"
      # Demo/LAN only (ADR 0081): the api sends push to the self-hosted ntfy behind Caddy's internal CA,
      # so skip push-endpoint TLS validation. NEVER set this in production.
      SimplCalCon__WebPush__AllowUntrustedPushEndpointTls: "true"

  # Self-hosted ntfy (Apache-2.0), opt-in via `--profile push` (ADR 0081). Caddy fronts it over HTTPS at
  # https://<LAN_HOST>:8443; ntfy itself only listens on the internal compose network. Ephemeral (no
  # volume) — a throwaway relay for push testing.
  ntfy:
    image: binwiederhier/ntfy:latest
    profiles: ["push"]
    restart: unless-stopped
    command: serve
    environment:
      NTFY_BASE_URL: "https://${LAN_HOST}:8443"
      NTFY_LISTEN_HTTP: ":80"
      NTFY_BEHIND_PROXY: "true"
