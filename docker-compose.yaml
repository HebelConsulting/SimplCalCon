# Local development / demo stack (ADR 0015, 0024). Runs unmodified under both
# `docker compose up --build` and `podman compose up --build` — one shared file.
# Runs in the Development environment (ephemeral OIDC keys, Scalar, demo seeding).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Bootstrap as the postgres superuser; db-init.sql creates the simplcalcon app roles
    # (LOGIN user + NOLOGIN group) and the database on first init (empty data dir).
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./deploy/db-init.sql:/docker-entrypoint-initdb.d/db-init.sql:ro
      - db-data:/var/lib/postgresql/data

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      SimplCalCon__Database__Provider: Postgres
      SimplCalCon__Database__ConnectionString: "Host=db;Database=simplcalcon;Username=simplcalcon;Password=simplcalcon"
      # The SPA's OIDC redirect origin must match where it's served (the seeded client).
      SimplCalCon__SpaClient__BaseUrl: "http://localhost:9080"
      SimplCalCon__Bootstrap__PlatformAdmin__Email: admin@simplcalcon.local
      SimplCalCon__Bootstrap__PlatformAdmin__Password: ChangeMe-Platform-2026
      SimplCalCon__Bootstrap__DemoTenant__TenantName: Demo
      SimplCalCon__Bootstrap__DemoTenant__TenantSlug: demo
      SimplCalCon__Bootstrap__DemoTenant__AdminEmail: admin@demo.local
      SimplCalCon__Bootstrap__DemoTenant__AdminPassword: ChangeMe-Demo-2026
    ports:
      - "9080:9080"

  # HTTPS front for native CalDAV/CardDAV clients (ADR 0032): Caddy terminates TLS with its
  # internal CA and proxies to the API. Web UI + OIDC keep using http://localhost:9080.
  # (Rootless Podman can't bind 443 by default — run rootful, or lower
  # net.ipv4.ip_unprivileged_port_start.)
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # Optional Postgres admin UI (ADR 0024). Opt-in and dev/demo only — it does NOT run in the
  # default stack; start it with:  docker compose --profile tools up -d pgadmin  (podman:
  # podman compose --profile tools up -d pgadmin). Then open http://localhost:6050 — desktop mode
  # (SERVER_MODE=False) means no pgAdmin login and no master password, and the pre-registered
  # "SimplCalCon (demo)" server auto-connects as the postgres superuser (its password comes from
  # the mounted passfile), so the tree is already connected. Dev-only, throwaway creds.
  pgadmin:
    image: dpage/pgadmin4:9.16
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # A login user is still required by the image even in desktop mode; it is never prompted for
      # (SERVER_MODE=False auto-authenticates) and is throwaway. `.local` is a reserved TLD — use `.dev`.
      PGADMIN_DEFAULT_EMAIL: admin@simplcalcon.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_SERVER_JSON_FILE: "/pgadmin4/servers.json"
    # libpq ignores a passfile unless it is mode 0600; a bind mount stays world-readable, so copy it
    # to /tmp/pgpass at 0600 before handing off to pgAdmin's own entrypoint.
    entrypoint: ["/bin/sh", "-c", "install -m 600 /pgpass.src /tmp/pgpass && exec /entrypoint.sh"]
    ports:
      - "6050:80"
    volumes:
      - ./deploy/pgadmin-servers.json:/pgadmin4/servers.json:ro
      - ./deploy/pgadmin-pgpass:/pgpass.src:ro

volumes:
  db-data:
  caddy-data:
  caddy-config:
